<script>
'use strict';

function twice(el,fn){if(el.dataset.arm){delete el.dataset.arm;el.classList.remove('arm');el.textContent=el.dataset.t;fn();return}
 el.dataset.t=el.dataset.t||el.textContent;el.dataset.arm='1';el.classList.add('arm');el.textContent='Yakin? Tekan lagi';
 setTimeout(()=>{if(el.dataset.arm){delete el.dataset.arm;el.classList.remove('arm');el.textContent=el.dataset.t}},3500)}

 for(let t=0;t<7;t++){const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*s));cv.height=Math.max(1,Math.round(h*s));const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);d=cv.toDataURL('image/png');if(d.length<=max)break;s*=.8}
 d.length<=max?ok(d):no(new Error('Gambar terlalu besar'))};im.onerror=()=>no(new Error('Gambar tidak bisa dibaca'));im.src=r.result};r.onerror=()=>no(new Error('Gambar tidak bisa dibaca'));r.readAsDataURL(f)})}

 const t=c.kind==='trial'?'percobaan · ':'';return`<span class="pill ${l<=7?'am':'ok'}">${t}${l} hari</span>`}

const STD={

function login(){if(!APPS.length){amsg('config.js belum berisi aplikasi.',1);return}if(!window.firebase){amsg('Layanan login belum siap.',1);return}amsg('');const a0=APPS[0],p=gprov();

 const out=()=>{logout().then(()=>setTimeout(()=>amsg('Sesi berakhir karena lama tidak dipakai. Silakan masuk lagi.',1),300))};
 if(ex()){out();return true}t();

/* =================== PIN (disimpan hanya di perangkat ini) =================== */
const PK='zui.adm2.pin',PFK='zui.adm2.pinf';let LKON=false,LKH=0;
const pinGet=()=>{try{return JSON.parse(localStorage.getItem(PK)||'null')}catch(e){return null}};
const pinF=()=>{try{return JSON.parse(localStorage.getItem(PFK)||'null')||{n:0,u:0}}catch(e){return{n:0,u:0}}};
function pinClr(){try{localStorage.removeItem(PK);localStorage.removeItem(PFK)}catch(e){}}
const b2h=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
async function pinHash(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b2h(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
function pinShow(){if(!pinGet())return;cls();LKON=true;$('#lk').classList.add('on');$('#lki').value='';$('#lke').textContent='';pinWait();setTimeout(()=>{try{$('#lki').focus()}catch(e){}},60)}
function pinWait(){const w=pinF().u-Date.now();clearTimeout(pinWait.t);if(w>0){$('#lke').textContent='Terlalu banyak percobaan. Coba lagi dalam '+Math.ceil(w/1000)+' detik.';$('#lki').disabled=true;pinWait.t=setTimeout(pinWait,1000)}else if($('#lki').disabled){$('#lki').disabled=false;$('#lke').textContent='';try{$('#lki').focus()}catch(e){}}}
async function pinChk(en){const p=pinGet();if(!p||!(window.crypto&&crypto.subtle))return;const v=$('#lki').value;if(v.length<p.n&&!en)return;if(v.length<4)return;const f=pinF();if(f.u>Date.now())return;
 if(await pinHash(v,p.s)===p.h){try{localStorage.removeItem(PFK)}catch(e){}LKON=false;$('#lk').classList.remove('on');$('#lki').value='';return}
 f.n++;if(f.n>=10){pinClr();LKON=false;$('#lk').classList.remove('on');toast('Terlalu banyak PIN salah. Masuk ulang dengan Google.');logout();return}
 if(f.n>=5)f.u=Date.now()+Math.min(30*Math.pow(2,f.n-5),600)*1000;try{localStorage.setItem(PFK,JSON.stringify(f))}catch(e){}$('#lki').value='';$('#lke').textContent='PIN salah ('+f.n+' dari 10)';pinWait()}
$('#lki').addEventListener('input',()=>pinChk());$('#lki').addEventListener('keydown',e=>{if(e.key==='Enter')pinChk(1)});
function pinDlg(m){const f=(id,l)=>`<label>${l}<input id="${id}" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="4 sampai 6 angka"></label>`;dlg(`<h2>${['Atur PIN','Ubah PIN','Matikan PIN'][m]}</h2>${m?f('pc','PIN sekarang'):''}${m<2?f('pn','PIN baru')+f('pn2','Ulangi PIN baru'):''}<p id="pm" class="amg er" role="alert"></p><div class="btn"><button data-a="close">Batal</button><button class="go" data-a="pinsave" data-v="${m}">Simpan</button></div>`)}
async function pinSave(m){const e=t=>{$('#pm').textContent=t},p=pinGet();if(!(window.crypto&&crypto.subtle)){e('Peramban ini tidak mendukung PIN.');return}
 if(m){if(!p||await pinHash($('#pc').value,p.s)!==p.h){e('PIN sekarang salah.');return}}if(m===2){pinClr();cls();toast('PIN dimatikan');rSet();return}
 const a=$('#pn').value,b=$('#pn2').value;if(!/^\d{4,6}$/.test(a)){e('PIN harus 4 sampai 6 angka.');return}if(a!==b){e('Kedua PIN tidak sama.');return}
 const s=b2h(crypto.getRandomValues(new Uint8Array(16)).buffer);try{localStorage.setItem(PK,JSON.stringify({s,n:a.length,h:await pinHash(a,s)}));localStorage.removeItem(PFK)}catch(x){e('Tidak dapat menyimpan PIN di perangkat ini.');return}cls();toast('PIN disimpan');rSet()}
